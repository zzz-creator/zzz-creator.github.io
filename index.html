<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zzz-creator — Projects</title>
<meta name="description" content="All published projects by zzz-creator, refreshed daily from the GitHub API.">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --card-border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  header h1 { margin: 0 0 .25rem; font-size: 2rem; letter-spacing: -.02em; }
  header p { margin: 0 0 1.5rem; color: var(--muted); }
  .toolbar { display: flex; gap: .75rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  #search {
    flex: 1 1 260px;
    min-width: 200px;
    padding: .6rem .9rem;
    font-size: 1rem;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #count { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: .5rem;
    padding: 1.1rem 1.2rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card h2 { margin: 0; font-size: 1.1rem; }
  .card h2 a { color: var(--accent); text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .card .desc {
    margin: 0;
    color: var(--muted);
    font-size: .92rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }
  .card .desc.empty { font-style: italic; opacity: .7; }
  .meta { display: flex; flex-wrap: wrap; gap: .9rem; font-size: .82rem; color: var(--muted); align-items: center; }
  .meta .lang::before {
    content: "";
    display: inline-block;
    width: .65rem; height: .65rem;
    border-radius: 50%;
    background: var(--green);
    margin-right: .35rem;
    vertical-align: baseline;
  }
  .badge {
    font-size: .72rem;
    padding: .1rem .5rem;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    color: var(--muted);
  }
  .status {
    padding: 2rem;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--card-border);
    border-radius: 10px;
    grid-column: 1 / -1;
  }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: .85rem; text-align: center; }
  footer a { color: var(--accent); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>zzz-creator</h1>
    <p>Published projects — refreshed daily from the GitHub API.</p>
  </header>

  <div class="toolbar">
    <label class="visually-hidden" for="search">Filter projects</label>
    <input id="search" type="search" placeholder="Filter projects…" autocomplete="off">
    <span id="count"></span>
  </div>

  <main id="grid" class="grid" aria-live="polite">
    <div class="status">Loading projects…</div>
  </main>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  "use strict";

  var projects = [];
  var grid = document.getElementById("grid");
  var search = document.getElementById("search");
  var count = document.getElementById("count");
  var footer = document.getElementById("footer");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString("en-GB", {
      year: "numeric", month: "short", day: "numeric"
    });
  }

  function render() {
    var q = search.value.trim().toLowerCase();
    var visible = projects.filter(function (p) {
      if (!q) return true;
      return (p.name + " " + (p.description || "") + " " + (p.language || ""))
        .toLowerCase().indexOf(q) !== -1;
    });

    count.textContent = visible.length === projects.length
      ? projects.length + " projects"
      : visible.length + " / " + projects.length + " projects";

    if (!visible.length) {
      grid.innerHTML = '<div class="status">No projects match “' + esc(search.value.trim()) + '”.</div>';
      return;
    }

    grid.innerHTML = visible.map(function (p) {
      var desc = p.description
        ? '<p class="desc">' + esc(p.description) + "</p>"
        : '<p class="desc empty">No description</p>';
      var lang = p.language
        ? '<span class="lang">' + esc(p.language) + "</span>"
        : "";
      var stars = p.stars
        ? "<span>★ " + p.stars + "</span>"
        : "";
      var fork = p.fork ? '<span class="badge">fork</span>' : "";
      var updated = p.updated_at
        ? "<span>Updated " + fmtDate(p.updated_at) + "</span>"
        : "";
      return '<article class="card">' +
        '<h2><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.name) + "</a></h2>" +
        desc +
        '<div class="meta">' + lang + stars + updated + fork +
        '<span><a href="' + esc(p.html_url) + '" target="_blank" rel="noopener" style="color:inherit">source ↗</a></span>' +
        "</div></article>";
    }).join("");
  }

  fetch("projects.json", { cache: "no-cache" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      projects = Array.isArray(data.projects) ? data.projects : [];
      render();
      var when = data.generatedAt ? fmtDate(data.generatedAt) : null;
      footer.innerHTML = "Data: " +
        '<a href="https://github.com/zzz-creator/zzz-creator.github.io">github.com/zzz-creator/zzz-creator.github.io</a>' +
        (when ? " · generated " + esc(when) : "") +
        " · <a href='projects.json'>projects.json</a>";
    })
    .catch(function (err) {
      grid.innerHTML = '<div class="status">Could not load projects.json (' +
        esc(err.message) + "). The site will show data after the next daily refresh.</div>";
    });

  search.addEventListener("input", function () {
    if (projects.length) render();
  });
})();
</script>
</body>
</html>
