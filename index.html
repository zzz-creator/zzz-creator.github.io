<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zzz-creator — Projects</title>
<meta name="description" content="All published projects by zzz-creator, refreshed daily from the GitHub API.">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --card-border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --pin: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  header h1 { margin: 0 0 .25rem; font-size: 2rem; letter-spacing: -.02em; }
  header p { margin: 0 0 1.5rem; color: var(--muted); }
  .toolbar { display: flex; gap: .75rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  #search {
    flex: 1 1 260px;
    min-width: 200px;
    padding: .6rem .9rem;
    font-size: 1rem;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #count { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: .5rem;
    padding: 1.1rem 1.2rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card h2 { margin: 0; font-size: 1.1rem; }
  .card h2 a { color: var(--accent); text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .card .desc {
    margin: 0;
    color: var(--muted);
    font-size: .92rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }
  .card .desc.empty { font-style: italic; opacity: .7; }
  .meta { display: flex; flex-wrap: wrap; gap: .9rem; font-size: .82rem; color: var(--muted); align-items: center; }
  .meta .lang::before {
    content: "";
    display: inline-block;
    width: .65rem; height: .65rem;
    border-radius: 50%;
    background: var(--green);
    margin-right: .35rem;
    vertical-align: baseline;
  }
  .badge {
    font-size: .72rem;
    padding: .1rem .5rem;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    color: var(--muted);
  }
  .badge.pinned {
    color: var(--pin);
    border-color: var(--pin);
  }
  .pinbtn {
    margin-left: auto;
    font: inherit;
    font-size: .78rem;
    padding: .15rem .55rem;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .pinbtn:hover { color: var(--pin); border-color: var(--pin); }
  .pinbtn[aria-pressed="true"] { color: var(--pin); border-color: var(--pin); }
  .section {
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 1rem 1.1rem 1.25rem;
    margin-bottom: 1.5rem;
    background: rgba(255, 255, 255, .015);
  }
  .section > h2 {
    margin: 0 0 .85rem;
    font-size: .95rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .section > h2 .n {
    font-size: .8rem;
    color: var(--muted);
    opacity: .7;
    text-transform: none;
    letter-spacing: 0;
  }
  .section .grid { margin: 0; }
  .status {
    padding: 2rem;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--card-border);
    border-radius: 10px;
    grid-column: 1 / -1;
  }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: .85rem; text-align: center; }
  footer a { color: var(--accent); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>zzz-creator</h1>
    <p>Published projects — refreshed daily from the GitHub API.</p>
  </header>

  <div class="toolbar">
    <label class="visually-hidden" for="search">Filter projects</label>
    <input id="search" type="search" placeholder="Filter projects…" autocomplete="off">
    <span id="count"></span>
  </div>

  <main id="grid" aria-live="polite">
    <div class="status">Loading projects…</div>
  </main>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  "use strict";

  var projects = [];
  var grid = document.getElementById("grid");
  var search = document.getElementById("search");
  var count = document.getElementById("count");
  var footer = document.getElementById("footer");

  var LS_KEY = "zzz-creator.pinned";

  // Repo pins come from pins.json (merged into projects.json by the workflow).
  // Local pins are per-browser and per-origin: they work on the live site but
  // do not carry across to a file:// open of this page.
  function readLocalPins() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(function (n) { return typeof n === "string"; }) : [];
    } catch (e) {
      return []; // private mode or corrupt value: fall back to no local pins
    }
  }

  function writeLocalPins(names) {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(names));
    } catch (e) {
      /* storage unavailable — pins simply do not persist */
    }
  }

  var localPins = readLocalPins();

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString("en-GB", {
      year: "numeric", month: "short", day: "numeric"
    });
  }

  function cardHTML(p, isPinned) {
    var desc = p.description
      ? '<p class="desc">' + esc(p.description) + "</p>"
      : '<p class="desc empty">No description</p>';
    var lang = p.language
      ? '<span class="lang">' + esc(p.language) + "</span>"
      : "";
    var stars = p.stars
      ? "<span>★ " + p.stars + "</span>"
      : "";
    var fork = p.fork ? '<span class="badge">fork</span>' : "";
    var updated = p.updated_at
      ? "<span>Updated " + fmtDate(p.updated_at) + "</span>"
      : "";
    var badge = isPinned ? '<span class="badge pinned">pinned</span>' : "";
    return '<article class="card">' +
      '<h2><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.name) + "</a></h2>" +
      desc +
      '<div class="meta">' + lang + stars + updated + fork + badge +
      '<span><a href="' + esc(p.html_url) + '" target="_blank" rel="noopener" style="color:inherit">source ↗</a></span>' +
      '<button type="button" class="pinbtn" data-pin="' + esc(p.name) + '" aria-pressed="' +
        (localPins.indexOf(p.name) !== -1) + '" title="Pin on this browser">' +
        (localPins.indexOf(p.name) !== -1 ? "unpin" : "pin") + "</button>" +
      "</div></article>";
  }

  function sectionHTML(title, items, isPinned) {
    if (!items.length) return "";
    return '<section class="section">' +
      "<h2>" + esc(title) + ' <span class="n">' + items.length + "</span></h2>" +
      '<div class="grid">' + items.map(function (p) {
        return cardHTML(p, isPinned);
      }).join("") + "</div></section>";
  }

  function render() {
    var q = search.value.trim().toLowerCase();

    // Searching ignores sections: matching should never hide a project just
    // because it sits in a section already shown further up the page.
    if (q) {
      var matches = projects.filter(function (p) {
        return (p.name + " " + (p.description || "") + " " + (p.language || ""))
          .toLowerCase().indexOf(q) !== -1;
      });
      count.textContent = matches.length + " / " + projects.length + " projects";
      grid.innerHTML = matches.length
        ? '<section class="section"><h2>Matches <span class="n">' + matches.length + "</span></h2>" +
          '<div class="grid">' + matches.map(function (p) {
            return cardHTML(p, isRepoPinned(p.name));
          }).join("") + "</div></section>"
        : '<div class="status">No projects match “' + esc(search.value.trim()) + '”.</div>';
      return;
    }

    var repoPinned = projects.filter(function (p) { return p.pinned; })
      .sort(function (a, b) { return (a.position || 0) - (b.position || 0); });
    var repoNamed = repoPinned.map(function (p) { return p.name; });
    var minePinned = projects.filter(function (p) {
      return localPins.indexOf(p.name) !== -1 && repoNamed.indexOf(p.name) === -1;
    });
    var rest = projects.filter(function (p) {
      return repoNamed.indexOf(p.name) === -1 && localPins.indexOf(p.name) === -1;
    });

    grid.innerHTML =
      sectionHTML("Pinned", repoPinned, true) +
      sectionHTML("My pinned", minePinned, true) +
      sectionHTML("All projects", rest, false);

    count.textContent = projects.length + " projects";
  }

  function isRepoPinned(name) {
    return projects.some(function (p) { return p.name === name && p.pinned; });
  }

  grid.addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest(".pinbtn") : null;
    if (!btn) return;
    var name = btn.getAttribute("data-pin");
    var i = localPins.indexOf(name);
    if (i === -1) localPins.push(name);
    else localPins.splice(i, 1);
    writeLocalPins(localPins);
    render();
  });

  // Repo pins are declared in pins.json and merged into projects.json by the
  // daily workflow; a name there that matches no project is ignored.
  fetch("projects.json", { cache: "no-cache" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      projects = Array.isArray(data.projects) ? data.projects : [];
      render();
      var when = data.generatedAt ? fmtDate(data.generatedAt) : null;
      footer.innerHTML = "Data: " +
        '<a href="https://github.com/zzz-creator/zzz-creator.github.io">github.com/zzz-creator/zzz-creator.github.io</a>' +
        (when ? " · generated " + esc(when) : "") +
        " · <a href='projects.json'>projects.json</a>" +
        " · <a href='pins.json'>pins.json</a>";
    })
    .catch(function (err) {
      grid.innerHTML = '<div class="status">Could not load projects.json (' +
        esc(err.message) + "). The site will show data after the next daily refresh.</div>";
    });

  search.addEventListener("input", function () {
    if (projects.length) render();
  });
})();
</script>
</body>
</html>
